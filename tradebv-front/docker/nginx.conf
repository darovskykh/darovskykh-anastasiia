server {
  listen 80;
  client_max_body_size 100M;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static files and fallback to index.html for SPA routes.
  # index.html is forced no-cache so a redeploy is picked up immediately
  # by browsers / proxies — otherwise stale HTML keeps pointing at old
  # /assets/<old-hash>.js bundles and users see yesterday's UI.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Explicit override for the SPA shell.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    # Re-emit the security headers because `add_header` from the server
    # block is dropped as soon as we add one here.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
  }

  # Long-term caching for built asset files (Vite emits content-hashed
  # filenames so they're safe to pin forever).
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Optional: basic security headers
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header X-XSS-Protection "1; mode=block";

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    internal;
  }
}
