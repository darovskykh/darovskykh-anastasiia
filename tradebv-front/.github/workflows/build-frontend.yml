run-name: Build ${{ github.ref_name }} environment
permissions:
  contents: read
  packages: write

env:
  ENV: "DEV"
  NAMESPACE: default

on:
  push:
    branches:
      - main
      - 'version/**'
      - 'version/core-prv?-?-?'

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    env:
      VITE_API_BASE_URL: "https://training.gart.technology/api/v1"
      VITE_WS_BASE_URL: "wss://training.gart.technology"
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Remove .env.local
        run: |
          if [ -f .env.local ]; then
            echo "Deleting .env.local to prevent accidental commits/build leaks"
            rm .env.local
          else
            echo ".env.local not found, skipping."
          fi

      - name: Get commit hash
        id: commit_hash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get commit timestamp
        id: commit_timestamp
        run: echo "date=$(git show -s --format=%ci ${GITHUB_SHA})" >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tolower
        run: echo "lowercase=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Determine BRANCH_NAME
        id: set_branch
        shell: bash
        run: |
          REF=${GITHUB_REF##*/}
          if [[ "$REF" == version/* ]]; then
            NAME=${REF#version/}
          else
            NAME=$REF
          fi
          BRANCH_NAME=${NAME,,}
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.tolower.outputs.lowercase }}_${{ env.BRANCH_NAME }}:${{ github.run_number }}
            ghcr.io/${{ steps.tolower.outputs.lowercase }}_${{ env.BRANCH_NAME }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.tolower.outputs.lowercase }}_${{ env.BRANCH_NAME }}:latest
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_WS_BASE_URL=${{ env.VITE_WS_BASE_URL }}
